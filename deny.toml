[advisories]
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is unmaintained. Transitive dependency via glib -> gtk -> tauri. No safe upgrade available. Build-time macro helper with no runtime security impact." },
  { id = "RUSTSEC-2025-0081", reason = "unic-char-property is unmaintained. Transitive via urlpattern -> tauri-utils -> tauri. Character property lookup with no security-critical functionality." },
  { id = "RUSTSEC-2025-0075", reason = "unic-char-range is unmaintained. Transitive via urlpattern -> tauri-utils -> tauri. No security impact." },
  { id = "RUSTSEC-2025-0080", reason = "unic-common is unmaintained. Transitive via urlpattern -> tauri-utils -> tauri. No security impact." },
  { id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident is unmaintained. Transitive via urlpattern -> tauri-utils -> tauri. Identifier parsing with no security-sensitive operations." },
  { id = "RUSTSEC-2025-0098", reason = "unic-ucd-version is unmaintained. Transitive via urlpattern -> tauri-utils -> tauri. No security impact." },
  { id = "RUSTSEC-2024-0429", reason = "glib unsoundness in VariantStrIter Iterator impls. Transitive via glib -> gtk -> tauri. VariantStrIter is not used in security-critical paths. Reviewed: desktop UI code does not expose this API externally." },
]

[licenses]
version = 2
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unlicense",
  "0BSD",
  "CC0-1.0",
  "Unicode-3.0",
  "Zlib",
  "BSL-1.0",
  "CDLA-Permissive-2.0",
  "MPL-2.0",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ring"
expression = "ISC"
license-files = [
  { path = "LICENSE", hash = 0x00147eb5 },
]

[licenses.private]
ignore = true

[sources]
allow-git = [
  "https://github.com/cjpais/vad-rs",
]
