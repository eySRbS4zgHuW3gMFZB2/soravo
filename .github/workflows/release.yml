name: Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-signed-release-prerequisites:
    name: Verify signed-release prerequisites
    runs-on: ubuntu-latest
    steps:
      # `12_SECURITY_BASELINE.md`: compare only secret presence here. No secret value is
      # read into shell, written to a file, printed, or uploaded. The signed
      # release must fail before it creates a draft release or builds artifacts.
      - name: Require Apple code-signing and notarization credentials
        if: ${{ secrets.APPLE_CERTIFICATE == '' || secrets.APPLE_CERTIFICATE_PASSWORD == '' || secrets.APPLE_SIGNING_IDENTITY == '' || secrets.APPLE_ID == '' || secrets.APPLE_PASSWORD == '' || secrets.APPLE_TEAM_ID == '' }}
        run: |
          echo "::error::Signed release requires APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD, and APPLE_TEAM_ID."
          exit 1
      - name: Require Tauri update-artifact signing key
        if: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY == '' }}
        run: |
          echo "::error::Signed release requires TAURI_SIGNING_PRIVATE_KEY."
          exit 1

  create-release:
    needs: verify-signed-release-prerequisites
    runs-on: ubuntu-latest
    outputs:
      release-id: ${{ steps.create-release.outputs.result }}
      version: ${{ steps.get-version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION=$(grep -o '"version": "[^"]*"' apps/desktop/src-tauri/tauri.conf.json | cut -d'"' -f4)
          echo "Application version from tauri.conf.json: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Draft Release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `v${{ steps.get-version.outputs.version }}`,
              name: `v${{ steps.get-version.outputs.version }}`,
              draft: true,
              prerelease: false,
              generate_release_notes: true
            });
            return data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only: distributable installers must not be assumed
          # from a cross-compiled binary.
          - platform: macos-15
            args: "--target aarch64-apple-darwin"
            target: aarch64-apple-darwin
          - platform: macos-15-intel
            args: "--target x86_64-apple-darwin"
            target: x86_64-apple-darwin
          - platform: windows-2025
            args: ""
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # T34-H / ADR-029: Vulkan SDK + SPIRV-Headers for the Windows x86_64
      # `vulkan` backend build (same mirror of cjpais/Handy @ 8605699d
      # build.yml as ci.yml desktop-windows). Windows leg only.
      - name: Install Vulkan SDK (Windows x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        uses: humbletim/install-vulkan-sdk@v1.2
        with:
          version: 1.4.309.0
          cache: true
      - name: Install SPIRV-Headers for transcribe-cpp Vulkan build (Windows x64)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          vcpkg install spirv-headers:x64-windows
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install spirv-headers failed" }
          $prefix = "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" -replace '\\','/'
          $combined = if ($env:CMAKE_PREFIX_PATH) { "$prefix;$env:CMAKE_PREFIX_PATH" } else { $prefix }
          Add-Content $env:GITHUB_ENV "CMAKE_PREFIX_PATH=$combined"
          Write-Host "CMAKE_PREFIX_PATH=$combined"

      # ADR-026 (T33-P-FOLLOWUP-4I): mirror of the Handy-proven x86_64 macOS
      # ORT provisioning in ci.yml. Release x86_64 macOS builds resolve
      # ort-sys identically, so they need the same ORT availability.
      # Gated to the x86_64 macOS leg only; ARM64/Windows legs untouched.
      - name: Provision ONNX Runtime (x86_64 macOS only)
        if: matrix.target == 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          ORT_VERSION="1.24.2"
          ORT_SHA256="590cee05699047b85e4a8115b4cec792073c2972ce78de383356a552a296a9c4"
          curl -L --fail -o ort.tgz "https://blob.handy.computer/onnxruntime-osx-x86_64-${ORT_VERSION}.tgz"
          # shasum ships with macOS (sha256sum is GNU-only); same check format.
          echo "${ORT_SHA256}  ort.tgz" | shasum -a 256 -c -
          tar xzf ort.tgz
          ORT_DIR="$GITHUB_WORKSPACE/onnxruntime-osx-x86_64-${ORT_VERSION}"
          echo "ORT_LIB_LOCATION=$ORT_DIR/lib" >> "$GITHUB_ENV"
          echo "ORT_PREFER_DYNAMIC_LINK=1" >> "$GITHUB_ENV"
          # Bundle the versioned dylib (matches the install name @rpath/libonnxruntime.1.24.2.dylib)
          jq --arg lib "$ORT_DIR/lib/libonnxruntime.${ORT_VERSION}.dylib" \
            '.bundle.macOS.frameworks = [$lib]' \
            apps/desktop/src-tauri/tauri.conf.json > tmp.json && mv tmp.json apps/desktop/src-tauri/tauri.conf.json

      - name: Build with Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signed macOS distribution. Values stay in GitHub Actions secrets and
          # are never committed, printed, or included in artifacts.
          # APPLE_CERTIFICATE: base64-encoded Developer ID Application .p12.
          # APPLE_CERTIFICATE_PASSWORD: password that unlocks that .p12.
          # APPLE_SIGNING_IDENTITY: Developer ID Application signing identity.
          # APPLE_ID/APPLE_PASSWORD/APPLE_TEAM_ID: notarization Apple ID,
          # app-specific password, and team identifier.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Signed Windows/update artifacts. The private key material stays in
          # GitHub Actions secrets. TAURI_SIGNING_PRIVATE_KEY_PASSWORD is
          # optional and is used only when the configured private key needs it.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          releaseId: ${{ needs.create-release.outputs.release-id }}
          args: ${{ matrix.args }}

      - name: Verify macOS code signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app)
          if ((${#apps[@]} != 1)); then
            echo "::error::Expected exactly one signed macOS app bundle."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "${apps[0]}"
          codesign --display --verbose=4 "${apps[0]}"
          spctl --assess --type execute --verbose=4 "${apps[0]}"

      - name: Verify macOS notarization ticket
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          apps=(apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app)
          dmgs=(apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if ((${#apps[@]} != 1 || ${#dmgs[@]} != 1)); then
            echo "::error::Expected exactly one app bundle and one disk image for notarization validation."
            exit 1
          fi
          xcrun stapler validate "${apps[0]}"
          xcrun stapler validate "${dmgs[0]}"

      - name: Verify Windows signature and timestamp
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleRoot = "apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle"
          $packages = Get-ChildItem -Path $bundleRoot -Recurse -Include *.msi,*.exe -File
          if ($packages.Count -eq 0) { throw "No Windows installer was produced." }
          foreach ($package in $packages) {
            $output = & signtool verify /pa /v $package.FullName 2>&1
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed for $($package.FullName)." }
            if ($output -notmatch 'Countersignature') { throw "Timestamp countersignature not found for $($package.FullName)." }
            Write-Host "Verified signature and timestamp: $($package.FullName)"
          }

      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: soravo-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app
          retention-days: 30

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: soravo-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
          retention-days: 30
