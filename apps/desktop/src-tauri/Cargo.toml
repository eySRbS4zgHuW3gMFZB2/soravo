[package]
name = "soravo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Soravo — local-first dictation for macOS and Windows"

[lib]
name = "soravo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "soravo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
cpal = "0.16"
enigo = "0.6.1"
ferrous-opencc = "0.4"
flate2 = "1"
futures-util = "0.3"
handy-keys = "0.3"
hf-hub = { version = "0.4", features = ["tokio"] }
isolang = "2"
log = "0.4"
natural = "0.5.0"
once_cell = "1"
rand = "0.8"
regex = "1"
reqwest = { version = "0.12", features = ["json"] }
rodio = "0.21"
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
soravo-audio = { path = "../../../crates/audio" }
soravo-config = { path = "../../../crates/config" }
soravo-hotkeys = { path = "../../../crates/hotkeys" }
# R1-GAP-005/006: session↔recording coupling reuses the canonical transcript
# contracts (workspace-internal; no supply-chain change).
soravo-transcript = { path = "../../../crates/transcript" }
soravo-typing = { path = "../../../crates/typing" }
specta = { version = "2.0.0-rc", features = ["derive"] }
strsim = "0.11.0"
tar = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-updater = "2"
tauri-specta = { version = "2.0.0-rc", features = ["derive"] }
tempfile = "3"
tokio-util = "0.7"
tokio = { version = "1", features = ["full"] }
# T34-H / ADR-029: transcribe-cpp backend posture ported exactly from Handy
# (cjpais/Handy @ 8605699d, bump commit 2d526b15 for 0.2.3 -> 0.2.4; per-platform
# features predate the bump and are reused verbatim). Whisper-family models run
# through transcribe-cpp (GGUF/ggml, native backends); per-platform backend
# features are added in the target tables below.
transcribe-cpp = { version = "0.2.4", default-features = false }
transcribe-rs = { version = "0.3", features = ["onnx"] }
whatlang = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gtk-layer-shell = { version = "0.8", features = ["v0_6"] }
# T34-H / ADR-029: Handy backend posture (dynamic-backends + vulkan), reused
# verbatim from cjpais/Handy @ 8605699d.
transcribe-cpp = { version = "0.2.4", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

[target.'cfg(windows)'.dependencies]
# T33-P-FOLLOWUP-2D-DECISION / ADR-023 (Path A): direct windows aligned with the
# Tauri/tao windows line (tao 0.37.1 / tauri 2.12.0 declare windows 0.62;
# locked 0.62.2). Supersedes the ADR-020 0.61.3 pin: the 0.61.3-vs-0.62.2 HWND
# type split (Family D, overlay.rs:165,365) is unified by compiling both the
# SetWindowPos call sites and tao/tauri's hwnd() against the same windows
# version. Same 11 features (all verified present in windows-0.62.2).
# webview2-com is deliberately NOT adopted (no error demands it);
# winreg stays at 0.10 per owner Decision 4 (zero errors attributable to it).
windows = { version = "0.62.2", features = [
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Ole",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.10"

# T34-H / ADR-029: Whisper backend per Windows arch, reused verbatim from
# cjpais/Handy @ 8605699d. x86_64 ships the Vulkan GPU backend and keeps the
# dynamic-backends posture (loadable per-ISA CPU modules + Vulkan).
#
# Windows-on-ARM is CPU-only: its Adreno Vulkan drivers are immature, and
# ggml-vulkan's shader generator (vulkan-shaders-gen) does not build under the
# clang-cl/lld toolchain that ggml's ARM CPU backend requires. dynamic-backends
# buys nothing on ARM — ALL_VARIANTS is an x86 concept, so a DL build there is
# just a single portable CPU module shipped as a DLL. So ARM links
# transcribe-cpp STATICALLY (no features = static CPU-only): the one CPU backend
# is compiled into the app binary and zero extra DLLs are shipped for it.
# CI pins -DGGML_NATIVE=OFF (see .github/workflows/ci.yml) so the static build
# targets a portable ARM baseline, not the build runner's CPU.
[target.'cfg(all(windows, target_arch = "x86_64"))'.dependencies]
transcribe-cpp = { version = "0.2.4", default-features = false, features = [
  "dynamic-backends",
  "vulkan",
] }

[target.'cfg(all(windows, target_arch = "aarch64"))'.dependencies]
transcribe-cpp = { version = "0.2.4", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
objc2-service-management = "0.3"
tauri-nspanel = "2"
# T34-H / ADR-029: Handy backend posture (metal, static link), reused verbatim
# from cjpais/Handy @ 8605699d.
transcribe-cpp = { version = "0.2.4", default-features = false, features = ["metal"] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

# R1-GAP-005/006: test-only seam proving the coupling through the existing
# STT abstraction. The mock engine/audio live in `soravo-stt::mock` (no
# hardware, model, or network); this dev-dependency never ships in the
# production binary and adds no external supply-chain surface (workspace path).
[dev-dependencies]
soravo-stt = { path = "../../../crates/stt" }

# T33-P-FOLLOWUP-2B / ADR-021: crate-scoped unsafe exception for the
# Handy-derived Win32 FFI (Windows builds only). The workspace
# `unsafe_code = "forbid"` is retained for every other crate; this crate
# uses `deny` (overridable, unlike `forbid`) so the four Windows-only
# modules allowlisted in src/lib.rs can carry a cfg-gated `allow`.
# This table must mirror future [workspace.lints] additions explicitly.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
