[package]
name = "soravo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Soravo — local-first dictation for macOS and Windows"

[lib]
name = "soravo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "soravo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soravo-hotkeys = { path = "../../../crates/hotkeys" }
soravo-typing = { path = "../../../crates/typing" }
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true
