[package]
name = "soravo-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Soravo Team"]
description = "Soravo — local-first dictation for macOS and Windows"

[lib]
name = "soravo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "soravo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_filter = "0.1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync"] }

# Tauri core
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-os = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"

# Audio/capture/typ
cpal = "0.16"
rtrb = "0.4"
hound = "3.5"
anyhow = "1"

# Hotkeys
rdev = { git = "https://github.com/rustdesk-org/rdev" }

# Typing/text injection
enigo = "0.6"

# Model support
hf-hub = { git = "https://github.com/cjpais/hf-hub", branch = "cancellable-downloads" }
transcribe-rs = { version = "0.3.8", features = ["onnx"] }
transcribe-cpp = "0.2.3"

# Platform plugins
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }
tauri-plugin-macos-permissions = "2"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"
