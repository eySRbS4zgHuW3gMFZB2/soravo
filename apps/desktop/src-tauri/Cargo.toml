[package]
name = "soravo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Soravo — local-first dictation for macOS and Windows"

[lib]
name = "soravo_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "soravo-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4"
cpal = "0.15"
enigo = "0.2"
gtk = { version = "0.11", package = "gtk4" }
gtk-layer-shell = "0.8"
log = "0.4"
rand = "0.8"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
soravo-config = { path = "../../../crates/config" }
soravo-hotkeys = { path = "../../../crates/hotkeys" }
soravo-typing = { path = "../../../crates/typing" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }

[lints]
workspace = true

[profile.release]
lto = true
codegen-units = 1
strip = true
