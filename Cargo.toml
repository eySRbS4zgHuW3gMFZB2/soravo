[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/audio",
  "crates/config",
  "crates/hotkeys",
  "crates/transcript",
  "crates/models",
  "crates/stt",
  "crates/scheduler"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Proprietary"
authors = ["Soravo Engineering"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
