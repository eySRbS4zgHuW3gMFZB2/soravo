[workspace]
members = [
  "apps/desktop/src-tauri",
  "crates/audio",
  "crates/config",
  "crates/diagnostics",
  "crates/desktop-auth",
  "crates/history",
  "crates/licensing",
  "crates/models",
  "crates/scheduler",
  "crates/stt",
  "crates/transcript",
  "crates/typing",
  "crates/vad"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Soravo Engineering"]

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
