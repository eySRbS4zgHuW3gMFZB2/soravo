[package]
name = "soravo-desktop-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Soravo desktop authentication handshake: PKCE, deep-link callback, session, secure token storage, offline entitlement policy"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1", features = ["derive"] }
keyring = "4"

[dev-dependencies]
serde_json = "1"
