[package]
name = "soravo-typing"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Soravo text injection abstraction - native + clipboard fallback"

[dependencies]
serde = { version = "1", features = ["derive"] }
log = "0.4"

[target.'cfg(windows)'.dependencies]
clipboard-win = "5"

[dev-dependencies]
serde_json = "1"
