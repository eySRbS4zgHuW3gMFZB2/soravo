[package]
name = "soravo-stt"
version = "0.1.0"
edition = "2021"
license = "Proprietary"
authors = ["Soravo Engineering"]

[dependencies]
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
soravo-models = { path = "../models" }
soravo-audio = { path = "../audio" }
transcribe-cpp = { version = "0.2", default-features = false }
transcribe-rs = { version = "0.3", features = ["onnx"] }
vad-rs = { git = "https://github.com/cjpais/vad-rs", default-features = false }
earshot = "1.2"
tokio = { version = "1.40", features = ["sync", "time"] }
anyhow = "1.0"
crossbeam-channel = "0.5"
log = "0.4"
